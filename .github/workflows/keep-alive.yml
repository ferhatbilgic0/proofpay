name: Keep demo awake

# Render's free plan sleeps after 15 idle minutes. This pings the live demo so judges never hit a cold start.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://proofpay-hp3b.onrender.com/api/health
